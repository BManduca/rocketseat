<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Fundo escuro padrão Rocketseat / Dark Theme -->
  <rect width="960" height="540" rx="16" fill="#121214" />

  <!-- ==================== CÍRCULO 1: TRACING ==================== -->
  <!-- Disco maior (Lilás) -->
  <circle cx="195" cy="270" r="140" fill="#9D9EE8" />
  
  <!-- Título TRACING -->
  <text 
    x="195" 
    y="190" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="18" 
    font-weight="700" 
    letter-spacing="1.5" 
    fill="#18181b">TRACING</text>

  <!-- Círculo menor (Centro branco) -->
  <circle cx="195" cy="270" r="44" fill="#FFFFFF" />

  <!-- ==================== CÍRCULO 2: MÉTRICAS ==================== -->
  <!-- Disco maior (Amarelo / Dourado) -->
  <circle cx="480" cy="270" r="140" fill="#F4BE53" />

  <!-- Título METRICAS -->
  <text 
    x="480" 
    y="190" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="18" 
    font-weight="700" 
    letter-spacing="1.5" 
    fill="#18181b">METRICAS</text>

  <!-- Círculo menor (Centro branco) -->
  <circle cx="480" cy="270" r="44" fill="#FFFFFF" />

  <!-- ==================== CÍRCULO 3: LOGS ==================== -->
  <!-- Disco maior (Verde / Sage) -->
  <circle cx="765" cy="270" r="140" fill="#6B968B" />

  <!-- Título LOGS -->
  <text 
    x="765" 
    y="190" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="18" 
    font-weight="700" 
    letter-spacing="1.5" 
    fill="#18181b">LOGS</text>

  <!-- Círculo menor (Centro branco) -->
  <circle cx="765" cy="270" r="44" fill="#FFFFFF" />
</svg>
