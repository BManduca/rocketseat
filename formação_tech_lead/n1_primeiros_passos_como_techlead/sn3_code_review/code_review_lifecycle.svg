<svg viewBox="0 0 1200 1200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sombra suave para destacar os círculos -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Marcador de ponta de seta aberta moderna -->
    <marker id="arrow" viewBox="0 0 24 24" refX="18" refY="12" markerWidth="22" markerHeight="22" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 6 4 L 18 12 L 6 20" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Fundo escuro com vinheta suave -->
  <rect width="1200" height="1200" fill="#121214" rx="20" />
  <circle cx="600" cy="600" r="500" fill="#18181f" opacity="0.6" />

  <!-- SETAS DO CICLO (sentido horário) -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
    <!-- PLANNING -> TESTING -->
    <line x1="360" y1="470" x2="470" y2="360" marker-end="url(#arrow)" />

    <!-- TESTING -> IMPLEMENTATION -->
    <line x1="730" y1="360" x2="840" y2="470" marker-end="url(#arrow)" />

    <!-- IMPLEMENTATION -> MAINTENANCE -->
    <line x1="840" y1="730" x2="730" y2="840" marker-end="url(#arrow)" />

    <!-- MAINTENANCE -> PLANNING -->
    <line x1="470" y1="840" x2="360" y2="730" marker-end="url(#arrow)" />
  </g>

  <!-- CÍRCULOS E TEXTOS -->
  <g filter="url(#shadow)">
    <!-- CENTRO: CODE REVIEW -->
    <circle cx="600" cy="600" r="140" fill="#FFFFFF" />
    <text x="600" y="608" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="23" letter-spacing="1.5" fill="#121214">
      CODE REVIEW
    </text>

    <!-- TOPO: TESTING -->
    <circle cx="600" cy="230" r="140" fill="#FFFFFF" />
    <text x="600" y="238" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="1.5" fill="#121214">
      TESTING
    </text>

    <!-- DIREITA: IMPLEMENTATION -->
    <circle cx="970" cy="600" r="140" fill="#FFFFFF" />
    <text x="970" y="608" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="19" letter-spacing="1.2" fill="#121214">
      IMPLEMENTATION
    </text>

    <!-- FUNDO: MAINTENANCE -->
    <circle cx="600" cy="970" r="140" fill="#FFFFFF" />
    <text x="600" y="978" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="1.5" fill="#121214">
      MAINTENANCE
    </text>

    <!-- ESQUERDA: PLANNING -->
    <circle cx="230" cy="600" r="140" fill="#FFFFFF" />
    <text x="230" y="608" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="1.5" fill="#121214">
      PLANNING
    </text>
  </g>
</svg>
