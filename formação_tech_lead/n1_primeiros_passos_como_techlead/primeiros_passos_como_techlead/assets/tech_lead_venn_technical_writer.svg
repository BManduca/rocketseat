<svg viewBox="0 0 600 570" width="600" height="570" xmlns="http://www.w3.org/2000/svg" style="background: #0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filtros de sombra suave -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Gradiente de preenchimento da interseção Técnico + Comunicador -->
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Clip da área do Círculo Técnico para desenhar a interseção perfeita -->
    <clipPath id="techCircleClip">
      <circle cx="230" cy="205" r="130" />
    </clipPath>
    <!-- Clip da área do Círculo Comunicador -->
    <clipPath id="commCircleClip">
      <circle cx="300" cy="320" r="130" />
    </clipPath>
  </defs>

  <!-- Círculo Líder (Atenuado / Fora de Foco) -->
  <circle cx="370" cy="205" r="130" fill="#A855F7" fill-opacity="0.08" stroke="#A855F7" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Textos do Líder (Atenuados) -->
  <text x="425" y="155" text-anchor="middle" fill="#A855F7" fill-opacity="0.35" font-size="16" font-weight="bold">👥 LÍDER</text>
  <text x="425" y="175" text-anchor="middle" fill="#94A3B8" fill-opacity="0.3" font-size="11">Mentoria, Gestão,</text>
  <text x="425" y="190" text-anchor="middle" fill="#94A3B8" fill-opacity="0.3" font-size="11">Cultura &amp; Conflitos</text>

  <!-- Círculo Técnico (Foco / Ciano) -->
  <circle cx="230" cy="205" r="130" fill="#38BDF8" fill-opacity="0.25" stroke="#38BDF8" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Círculo Comunicador (Foco / Esmeralda) -->
  <circle cx="300" cy="320" r="130" fill="#34D399" fill-opacity="0.25" stroke="#34D399" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Preenchimento e Linhas de Interseção: Técnico + Comunicador -->
  <!-- 1. Preenchimento da interseção com gradiente suave -->
  <g clip-path="url(#techCircleClip)">
    <circle cx="300" cy="320" r="130" fill="url(#twGrad)" />
  </g>

  <!-- 2. Linhas internas da interseção visíveis e nítidas -->
  <g clip-path="url(#techCircleClip)">
    <circle cx="300" cy="320" r="130" fill="none" stroke="#34D399" stroke-width="2.5" />
  </g>
  <g clip-path="url(#commCircleClip)">
    <circle cx="230" cy="205" r="130" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  </g>

  <!-- Textos Principais dos Círculos em Foco -->
  <text x="175" y="155" text-anchor="middle" fill="#38BDF8" font-size="16" font-weight="bold">💻 TÉCNICO</text>
  <text x="175" y="175" text-anchor="middle" fill="#94A3B8" font-size="11">Código, Arquitetura,</text>
  <text x="175" y="190" text-anchor="middle" fill="#94A3B8" font-size="11">Padrões &amp; Qualidade</text>

  <text x="300" y="405" text-anchor="middle" fill="#34D399" font-size="16" font-weight="bold">🗣️ COMUNICADOR</text>
  <text x="300" y="423" text-anchor="middle" fill="#94A3B8" font-size="11">Alinhamento, Negócio</text>
  <text x="300" y="438" text-anchor="middle" fill="#94A3B8" font-size="11">&amp; Stakeholders</text>

  <!-- Outras Interseções (Atenuadas) -->
  <text x="300" y="155" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">Mentor Técnico</text>
  <text x="380" y="295" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">Product Manager</text>

  <!-- Centro Tech Lead (Atenuado) -->
  <circle cx="300" cy="245" r="38" fill="#1E293B" fill-opacity="0.6" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="300" y="243" text-anchor="middle" fill="#64748B" font-size="11" font-weight="bold">🚀</text>
  <text x="300" y="255" text-anchor="middle" fill="#64748B" font-size="9" font-weight="700">TECH LEAD</text>

  <!-- Nome dentro da Interseção -->
  <text x="220" y="295" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" filter="url(#textGlow)">Technical Writer</text>

  <!-- Bloco Explicativo com mais espaço e maior detalhamento -->
  <rect x="40" y="475" width="520" height="74" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2" filter="url(#glow)"/>
  
  <!-- Título do Bloco -->
  <text x="60" y="500" fill="#38BDF8" font-size="12" font-weight="bold">
    ✍️ Papel de Technical Writer / Tradutor Técnico:
  </text>

  <!-- Descrição Detalhada em 2 linhas -->
  <text x="60" y="520" fill="#E2E8F0" font-size="11" font-weight="400">
    • Traduz desafios técnicos complexos em linguagem clara para áreas de produto e negócio.
  </text>
  <text x="60" y="536" fill="#94A3B8" font-size="11" font-weight="400">
    • Documenta decisões de arquitetura (ADRs), especificações e guias técnicos para o time.
  </text>
</svg>
