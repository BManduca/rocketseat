<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-mint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-white" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow-circle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="25" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#57ffb6" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#121214" />
  <circle cx="960" cy="540" r="600" fill="#1a1a20" opacity="0.45" />

  <!-- ARROWS -->
  <g filter="url(#glow-mint)" stroke="#57ffb6" stroke-width="4.5" fill="none" stroke-linecap="round">
    <path d="M 505 450 Q 670 345 830 445" marker-end="url(#arrow)" />
    <path d="M 830 635 Q 670 735 515 635" marker-end="url(#arrow)" />
    <path d="M 1410 450 Q 1250 345 1090 445" marker-end="url(#arrow)" />
    <path d="M 1090 635 Q 1250 735 1410 635" marker-end="url(#arrow)" />
  </g>

  <!-- CIRCLES -->
  <g filter="url(#shadow-circle)">
    <circle cx="380" cy="540" r="150" fill="#FFFFFF" />
    <text x="380" y="548" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="1.5" fill="#121214">
      PLANNING
    </text>
  </g>

  <g filter="url(#shadow-circle)">
    <circle cx="960" cy="540" r="150" fill="#FFFFFF" />
    <text x="960" y="528" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="1.5" fill="#121214">
      CODE
    </text>
    <text x="960" y="566" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="1.5" fill="#121214">
      REVIEW
    </text>
  </g>

  <g filter="url(#shadow-circle)">
    <circle cx="1540" cy="540" r="150" fill="#FFFFFF" />
    <text x="1540" y="548" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="25" letter-spacing="1.5" fill="#121214">
      IMPLEMENTATION
    </text>
  </g>
</svg>
